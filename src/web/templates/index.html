<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>comic</title>
  <link rel="stylesheet" href="/static/app.css?v=11">
  <script src="/static/app.js?v=11" defer></script>
</head>
<body>
  <header>
    <nav aria-label="主导航">
      <button data-tab="browse" class="active">发现漫画</button>
      <button data-tab="library">我的书库</button>
      <button data-tab="downloads">下载任务</button>
    </nav>
    <div class="actions">
      <button id="theme" class="icon-btn" title="切换主题" aria-label="切换主题">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <button id="accounts" class="icon-btn" title="图源管理" aria-label="图源管理">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
      </button>
    </div>
  </header>
  <main>
    <section id="browse">
      <h1 class="wordmark">Comic</h1>
      <form id="browse-form" class="searchbox" autocomplete="off">
        <input id="keyword" placeholder="搜索漫画" maxlength="200" autofocus autocomplete="off" aria-label="搜索漫画">
        <button class="primary" type="submit" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
      </form>
      <p id="browse-status" role="status"></p><div id="results" class="grid"></div>
    </section>
    <section id="library" hidden>
      <div class="section-head"><h1>我的书库</h1><button id="library-refresh" class="icon-btn" title="刷新书库" aria-label="刷新书库"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg></button></div>
      <label>分类<select id="library-category"><option value="*">全部分类</option></select></label>
      <div id="books" class="grid"></div>
    </section>
    <section id="downloads" hidden>
      <div class="section-head"><h1>下载任务</h1><button id="tasks-refresh" class="icon-btn" title="刷新任务" aria-label="刷新任务"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg></button></div>
      <div id="tasks"></div>
    </section>
  </main>
  <dialog id="detail-dialog"><div class="dialog-head"><h2 id="detail-title">漫画详情</h2><button class="icon-btn" data-close="detail-dialog" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div><div id="detail-body"></div></dialog>
  <dialog id="account-dialog"><div class="dialog-head"><h2>图源管理</h2><button class="icon-btn" data-close="account-dialog" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div><div id="source-list"></div></dialog>
  <dialog id="source-settings-dialog"><div class="dialog-head"><h2 id="source-settings-title">图源设置</h2><button class="icon-btn" data-close="source-settings-dialog" title="返回图源列表" aria-label="返回图源列表"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button></div>
    <div id="source-settings-body"></div>
  </dialog>
  <dialog id="credentials-dialog"><div class="dialog-head"><h2 id="credentials-title">登录凭证</h2><button class="icon-btn" data-close="credentials-dialog" title="返回设置" aria-label="返回设置"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button></div><div id="account-state"></div><form id="login-form"></form></dialog>
  <dialog id="reader-dialog">
    <div class="reader-toolbar"><button id="reader-close">退出阅读</button><span id="reader-title"></span></div>
    <div id="reader-pages"></div>
    <div class="reader-controls">
      <select id="reader-mode" aria-label="阅读模式"><option value="scroll">滚动阅读</option><option value="page">翻页阅读</option></select>
      <button id="chapter-prev">上一章</button><button id="page-prev">上一页</button><span id="page-status"></span><button id="page-next">下一页</button><button id="chapter-next">下一章</button>
    </div>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
