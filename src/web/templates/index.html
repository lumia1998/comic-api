<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聚合漫画引擎 - Aggregate Comic Portal</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.remove('light');
      }
    })();
  </script>
</head>
<body class="home-search-mode">

  <!-- Top Navigation Header -->
  <nav class="navbar">
    <div class="nav-logo">comic</div>

    <!-- Tabs pill navigation -->
    <div class="tabs-container">
      <button class="tab-trigger active" id="trigger-search" onclick="switchTab('search')">
        <iconify-icon icon="lucide:search" style="font-size: 1rem; display: flex;"></iconify-icon>聚合检索
      </button>
      <button class="tab-trigger" id="trigger-leaderboard" onclick="switchTab('leaderboard')">
        <iconify-icon icon="lucide:trophy" style="font-size: 1rem; display: flex;"></iconify-icon>漫画排行
      </button>
      <button class="tab-trigger" id="trigger-category" onclick="switchTab('category')">
        <iconify-icon icon="lucide:folder" style="font-size: 1rem; display: flex;"></iconify-icon>分类浏览
      </button>
      <button class="tab-trigger" id="trigger-latest" onclick="switchTab('latest')">
        <iconify-icon icon="lucide:zap" style="font-size: 1rem; display: flex;"></iconify-icon>最近更新
      </button>
      <button class="tab-trigger" id="trigger-random" onclick="switchTab('random')">
        <iconify-icon icon="lucide:dice-5" style="font-size: 1rem; display: flex;"></iconify-icon>随机推荐
      </button>
    </div>

    <!-- Right status badge & Theme Toggle -->
    <div class="bika-status-container">
      <button class="status-badge" id="theme-toggle-btn" onclick="toggleTheme()" title="切换亮色/暗色模式" style="padding: 8px 12px; font-family: inherit; outline: none;">
        <iconify-icon id="theme-icon" icon="lucide:moon" style="font-size: 1.1rem; display: flex;"></iconify-icon>
      </button>
      <div class="status-badge" onclick="showLoginModal()" title="点击绑定或管理哔咔账户">
        <span class="dot {{ 'green' if bika_authed else 'yellow' }}" id="bika-dot"></span>
        <span id="bika-status-text">{{ '哔咔已登录' if bika_authed else '哔咔未登录 (点击绑定)' }}</span>
      </div>
    </div>
  </nav>

  <div class="container centered-mode" id="main-container">
    <div class="portal-logo" id="portal-logo">comic</div>
    <!-- Search Form Row -->
    <div class="search-form-row" id="search-row">
      <input type="text" class="input-minimal" id="search-input" placeholder="输入漫画名称或 ID，一键聚合搜索" onkeydown="if(event.key === 'Enter') performSearch()">
      <button class="btn-primary" onclick="performSearch()">聚合检索</button>
    </div>

    <!-- 1. Search Tab Content -->
    <div class="tab-content active" id="tab-search">

      <!-- 加载提示 -->
      <div class="loading" id="search-loader">
        <div class="spinner"></div>
        <p style="color: var(--muted-foreground); font-size: 0.875rem;">正在搜索...</p>
      </div>

      <!-- 最佳匹配 (隐藏) -->
      <section class="best-match-section" id="best-match-section" style="display: none;">
        <div class="best-card" id="best-card">
          <!-- 动态生成 -->
        </div>
      </section>

      <!-- 统一检索结果 -->
      <div class="search-results-section" id="search-results-section" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">
          <h2 style="font-size: 1.125rem; font-weight: 600;">搜索结果</h2>
          <span style="font-size: 0.875rem; color: var(--muted-foreground);" id="search-results-count">为您找到 0 条符合条件的漫画</span>
        </div>
        <div class="search-results-list" id="search-results-list"></div>
        <div class="pagination-container" id="search-pagination"></div>
      </div>
    </div>

    <!-- 2. Leaderboard Tab Content -->
    <div class="tab-content" id="tab-leaderboard">
      <div class="filter-row">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">源平台</label>
          <select class="select-minimal" id="leaderboard-source" onchange="updateLeaderboardModes()">
            <option value="jm">禁漫天堂</option>
            <option value="bika">哔咔漫画</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">时间维度</label>
          <select class="select-minimal" id="leaderboard-mode">
            <!-- 动态更新 -->
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">页码</label>
          <select class="select-minimal" id="leaderboard-page">
            <option value="1">第 1 页</option>
            <option value="2">第 2 页</option>
            <option value="3">第 3 页</option>
            <option value="4">第 4 页</option>
            <option value="5">第 5 页</option>
          </select>
        </div>
        <button class="btn-primary" onclick="loadLeaderboard()">获取排行</button>
      </div>

      <div class="loading" id="leaderboard-loader">
        <div class="spinner"></div>
        <p style="color: var(--muted-foreground); font-size: 0.875rem;">正在加载排行榜...</p>
      </div>

      <div id="leaderboard-container">
        <!-- 动态生成格子列表 -->
      </div>
    </div>

    <!-- 3. Category Tab Content -->
    <div class="tab-content" id="tab-category">
      <div class="filter-row">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">源平台</label>
          <select class="select-minimal" id="category-source" onchange="updateCategoryOptions(); updateBikaSortVisibility('category')">
            <option value="jm">禁漫天堂</option>
            <option value="bika">哔咔漫画</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">分类选择</label>
          <select class="select-minimal" id="category-name">
            <!-- 动态生成 -->
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;" id="category-sort-group" style="display:none;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;" id="category-sort-label">排序方式</label>
          <select class="select-minimal" id="category-sort">
            <!-- 动态更新 -->
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">页码</label>
          <select class="select-minimal" id="category-page">
            <option value="1">第 1 页</option>
            <option value="2">第 2 页</option>
            <option value="3">第 3 页</option>
            <option value="4">第 4 页</option>
            <option value="5">第 5 页</option>
          </select>
        </div>
        <button class="btn-primary" onclick="loadCategory()">筛选分类</button>
      </div>

      <div class="loading" id="category-loader">
        <div class="spinner"></div>
        <p style="color: var(--muted-foreground); font-size: 0.875rem;">正在按分类加载...</p>
      </div>

      <div id="category-container">
        <!-- 动态生成 -->
      </div>
    </div>

    <!-- 4. Latest Tab Content -->
    <div class="tab-content" id="tab-latest">
      <div class="filter-row">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">源平台</label>
          <select class="select-minimal" id="latest-source" onchange="updateBikaSortVisibility('latest')">
            <option value="jm">禁漫天堂</option>
            <option value="bika">哔咔漫画</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;" id="latest-sort-group">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">排序方式 (哔咔)</label>
          <select class="select-minimal" id="latest-sort">
            <option value="dd">最新上架</option>
            <option value="ld">最多喜欢</option>
            <option value="vd">最多观看</option>
            <option value="da">最旧上架</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">页码</label>
          <select class="select-minimal" id="latest-page">
            <option value="1">第 1 页</option>
            <option value="2">第 2 页</option>
            <option value="3">第 3 页</option>
            <option value="4">第 4 页</option>
            <option value="5">第 5 页</option>
          </select>
        </div>
        <button class="btn-primary" onclick="loadLatest()">获取列表</button>
      </div>

      <div class="loading" id="latest-loader">
        <div class="spinner"></div>
        <p style="color: var(--muted-foreground); font-size: 0.875rem;">正在加载漫画列表...</p>
      </div>

      <div id="latest-container">
        <!-- 动态生成 -->
      </div>
    </div>

    <!-- 5. Random Tab Content -->
    <div class="tab-content" id="tab-random">
      <div class="filter-row">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 500;">源平台</label>
          <select class="select-minimal" id="random-source">
            <option value="jm">禁漫天堂</option>
            <option value="bika">哔咔漫画</option>
          </select>
        </div>
        <button class="btn-primary" onclick="loadRandom()" style="display: inline-flex; align-items: center; gap: 8px;">
          <iconify-icon icon="lucide:dice-5" style="font-size: 1rem; display: flex;"></iconify-icon>随机推荐本子
        </button>
      </div>

      <div class="loading" id="random-loader">
        <div class="spinner"></div>
        <p style="color: var(--muted-foreground); font-size: 0.875rem;">正在随机推荐...</p>
      </div>

      <div id="random-container">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>

  <!-- 漫画章节抽屉弹窗 (Sleek Drawer) -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer(event)">
    <div class="drawer" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <div class="drawer-header-title" id="drawer-title">漫画详情</div>
        <button class="btn-close" onclick="toggleDrawer(false)" aria-label="关闭">
          <iconify-icon icon="lucide:x" style="font-size: 1.1rem; display: flex;"></iconify-icon>
        </button>
      </div>
      <div class="drawer-body">
        <div class="detail-sidebar">
          <img id="drawer-cover" src="" alt="封面" onerror="this.onerror=null; this.src=FALLBACK_COVER">
          <div id="drawer-meta">
            <!-- 动态生成 -->
          </div>
        </div>
        <div class="episodes-panel">
          <h3>全部章节列表</h3>
          <div class="episodes-list" id="drawer-chapters">
            <!-- 章节按钮 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 无缝滚动阅读器 -->
  <div class="reader-overlay mode-scroll" id="reader-overlay">
    <!-- 顶部触发区 -->
    <div class="reader-top-trigger"></div>
    <div class="reader-header">
      <div class="drawer-header-title" id="reader-title" style="white-space: nowrap; text-overflow: ellipsis; overflow: hidden; max-width: 80%;">正在阅读</div>
      <button class="btn-close" onclick="closeReader()" aria-label="关闭" style="flex-shrink: 0;">
        <iconify-icon icon="lucide:x" style="font-size: 1.1rem; display: flex;"></iconify-icon>
      </button>
    </div>

    <div class="reading-container" id="reading-container" onclick="handleReaderClick(event)">
      <!-- 漫画图 -->
    </div>

    <!-- 底部触发区 -->
    <div class="reader-bottom-trigger"></div>
    <!-- 底部悬浮控制栏 -->
    <div class="reader-bottom-bar" id="reader-bottom-bar" onclick="event.stopPropagation()">
      <!-- 页面指示器 -->
      <div class="reader-bottom-indicator" id="reader-page-indicator">0 / 0</div>

      <!-- 模式切换开关 -->
      <div class="tabs-container" style="padding: 2px; scale: 0.9; margin: 0 16px; flex-shrink: 0;">
        <button class="tab-trigger active" id="btn-reader-scroll" onclick="setReaderMode('scroll')">
          <iconify-icon icon="lucide:arrow-up-down" style="font-size: 0.85rem; display: flex;"></iconify-icon>条漫模式
        </button>
        <button class="tab-trigger" id="btn-reader-page" onclick="setReaderMode('page')">
          <iconify-icon icon="lucide:book-open" style="font-size: 0.85rem; display: flex;"></iconify-icon>单页模式
        </button>
      </div>

      <!-- 上下翻页按钮 -->
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="reader-control-btn" onclick="navigateReader(-1, event)" title="上一页 (PageUp)">
          <iconify-icon icon="lucide:chevron-up" style="font-size: 1rem; display: flex;"></iconify-icon>
        </button>
        <button class="reader-control-btn" onclick="navigateReader(1, event)" title="下一页 (PageDown)">
          <iconify-icon icon="lucide:chevron-down" style="font-size: 1rem; display: flex;"></iconify-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- 哔咔登录模态弹窗 (Sleek Zinc Dialog) -->
  <div class="login-overlay" id="login-overlay" onclick="closeLoginModal(event)">
    <div class="login-card" onclick="event.stopPropagation()">
      <button class="login-close" onclick="hideLoginModal()" aria-label="关闭">
        <iconify-icon icon="lucide:x" style="font-size: 1.1rem; display: flex;"></iconify-icon>
      </button>
      <h3>绑定 哔咔漫画 账户</h3>
      <p style="font-size: 0.8125rem; color: var(--muted-foreground); margin-bottom: 20px; line-height: 1.4;">
        哔咔部分接口需要账号授权。请输入哔咔账号密码以获取访问 Token，仅用于向哔咔请求数据。
      </p>
      
      <div class="form-group">
        <label>注册邮箱 / 账号 (Email)</label>
        <input type="text" id="login-email" placeholder="example@email.com">
      </div>
      
      <div class="form-group">
        <label>登录密码 (Password)</label>
        <input type="password" id="login-password" placeholder="请输入您的密码">
      </div>
      
      <button class="btn-submit" onclick="submitBikaLogin()">授权绑定</button>
    </div>
  </div>

  <script>
    // 常量定义
    // 本地内联 SVG 占位图，避免依赖外部图床（外链失效是常见问题）
    const FALLBACK_COVER = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400' viewBox='0 0 300 400'>
        <rect width='300' height='400' fill='#18181b'/>
        <g fill='none' stroke='#3f3f46' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'>
          <rect x='105' y='150' width='90' height='110' rx='6'/>
          <path d='M105 220l24-24 20 20 30-34 16 18'/>
        </g>
        <circle cx='132' cy='178' r='9' fill='#3f3f46'/>
        <text x='150' y='300' text-anchor='middle' fill='#52525b' font-family='sans-serif' font-size='15'>封面缺失</text>
      </svg>`
    );

    const JM_CATEGORIES = [
      { value: "latest", label: "最新发布 (Latest)" },
      { value: "doujin", label: "同人志 (Doujin)" },
      { value: "single", label: "单本 (Single)" },
      { value: "short", label: "短篇 (Short)" },
      { value: "hanman", label: "韩漫 (Korean)" },
      { value: "meishi", label: "美图 (Illustrations)" },
      { value: "cosplay", label: "Cosplay" },
      { value: "3d", label: "3D动漫" }
    ];

    const BIKA_CATEGORIES = [
      { value: "嗶咔漢化", label: "哔咔汉化" },
      { value: "同人", label: "同人志" },
      { value: "全彩", label: "全彩" },
      { value: "少女漫畫", label: "少女漫画" },
      { value: "耽美", label: "耽美/腐" },
      { value: "妹子", label: "美少女" },
      { value: "治癒", label: "治愈" },
      { value: "都市", label: "都市" },
      { value: "冒險", label: "冒险" }
    ];

    let currentComicId = "";
    let currentSource = "";
    let searchResults = [];
    let searchCurrentPage = 1;
    const searchPageSize = 12;
    let readerMode = "scroll";
    let readerImages = [];
    let readerCurrentIndex = 0;

    // Sleek Custom Toast Notifications
    function showToast(message, duration = 4000) {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<iconify-icon icon="lucide:bell" style="font-size: 1.1rem; flex-shrink: 0;"></iconify-icon><span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.add('fade-out');
        toast.addEventListener('animationend', () => {
          toast.remove();
        });
      }, duration);
    }

    // 页面主题模式
    function initThemeIcon() {
      const isLight = document.documentElement.classList.contains('light');
      const themeIcon = document.getElementById('theme-icon');
      if (themeIcon) {
        themeIcon.setAttribute('icon', isLight ? 'lucide:sun' : 'lucide:moon');
      }
    }

    function toggleTheme() {
      const isLight = document.documentElement.classList.toggle('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      initThemeIcon();
    }

    // 页面初始化
    document.addEventListener("DOMContentLoaded", () => {
      initThemeIcon();
      updateLeaderboardModes();
      updateCategoryOptions();
      updateBikaSortVisibility('category');
      updateBikaSortVisibility('latest');
    });

    // 1. Tab 开关逻辑
    function switchTab(tabId) {
      const searchRow = document.getElementById("search-row");
      if (searchRow) {
        searchRow.style.display = (tabId === "search") ? "flex" : "none";
      }

      const container = document.getElementById("main-container");
      if (container) {
        if (tabId === "search") {
          const resultsSection = document.getElementById("search-results-section");
          const hasResults = (resultsSection && resultsSection.style.display === "block");
          if (!hasResults) {
            container.classList.add("centered-mode");
            document.body.classList.add("home-search-mode");
          } else {
            container.classList.remove("centered-mode");
            document.body.classList.remove("home-search-mode");
          }
        } else {
          container.classList.remove("centered-mode");
          document.body.classList.remove("home-search-mode");
        }
      }

      // 1. 清理 active 状态
      document.querySelectorAll(".tab-trigger").forEach(btn => btn.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

      // 2. 激活新面板
      const activeTrigger = document.getElementById(`trigger-${tabId}`);
      if (activeTrigger) activeTrigger.classList.add("active");
      
      const activeContent = document.getElementById(`tab-${tabId}`);
      if (activeContent) activeContent.classList.add("active");

      // 3. 切换时如果内容未加载，则自动获取数据
      if (tabId === "random" && !document.getElementById("random-container").querySelector(".grids-container")) {
        loadRandom();
      } else if (tabId === "latest" && !document.getElementById("latest-container").querySelector(".grids-container")) {
        loadLatest();
      } else if (tabId === "leaderboard" && !document.getElementById("leaderboard-container").querySelector(".grids-container")) {
        loadLeaderboard();
      } else if (tabId === "category" && !document.getElementById("category-container").querySelector(".grids-container")) {
        loadCategory();
      }
    }

    // 动态更新排序选项（禁漫和哔咔选项不同）
    const JM_SORT_OPTIONS = [
      { value: "new", label: "最新上架" },
      { value: "mv",  label: "最多观看" },
      { value: "tf",  label: "最多收藏/喜欢" },
      { value: "mp",  label: "最多指名" },
    ];
    const BIKA_SORT_OPTIONS = [
      { value: "dd", label: "最新上架" },
      { value: "ld", label: "最多喜欢" },
      { value: "vd", label: "最多观看" },
      { value: "da", label: "最旧上架" },
    ];

    function updateBikaSortVisibility(tab) {
      const sourceId = tab === 'category' ? 'category-source' : 'latest-source';
      const sortGroupId = tab === 'category' ? 'category-sort-group' : 'latest-sort-group';
      const sortSelectId = tab === 'category' ? 'category-sort' : 'latest-sort';
      const sortLabelId = tab === 'category' ? 'category-sort-label' : null;

      const src = document.getElementById(sourceId).value;
      const sortGroup = document.getElementById(sortGroupId);
      const sortSelect = document.getElementById(sortSelectId);
      const options = (src === 'jm') ? JM_SORT_OPTIONS : BIKA_SORT_OPTIONS;

      // 始终显示排序框（两平台都支持）
      sortGroup.style.display = 'flex';

      // 更新标签
      if (sortLabelId) {
        const label = document.getElementById(sortLabelId);
        if (label) label.innerText = (src === 'jm') ? '排序方式 (禁漫)' : '排序方式 (哔咔)';
      }

      // 重新填充选项
      sortSelect.innerHTML = '';
      options.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.value;
        el.innerText = opt.label;
        sortSelect.appendChild(el);
      });
    }

    // 联动更新：排行榜的时间过滤选项

    // 2. APIs 核心调用方法
    // 2.1 聚合搜索
    function getSimilarity(keyword, title) {
      const kw = keyword.toLowerCase().replace(/[\s\-_]/g, '');
      const t = title.toLowerCase().replace(/[\s\-_]/g, '');
      
      if (t.includes(kw)) {
        return 0.8 + (kw.length / t.length) * 0.2;
      }
      
      const getBigrams = (str) => {
        const bigrams = new Set();
        for (let i = 0; i < str.length - 1; i++) {
          bigrams.add(str.substring(i, i + 2));
        }
        return bigrams;
      };
      
      const kwBigrams = getBigrams(kw);
      const tBigrams = getBigrams(t);
      
      if (kwBigrams.size === 0 || tBigrams.size === 0) {
        const kwChars = new Set(kw.split(''));
        let matches = 0;
        for (let char of kwChars) {
          if (t.includes(char)) matches++;
        }
        return kw.length > 0 ? (matches / kw.length) * 0.5 : 0;
      }
      
      let intersection = 0;
      for (let bigram of kwBigrams) {
        if (tBigrams.has(bigram)) intersection++;
      }
      
      return (2.0 * intersection) / (kwBigrams.size + tBigrams.size);
    }

    function renderSearchPage(page) {
      searchCurrentPage = page;
      const start = (page - 1) * searchPageSize;
      const end = page * searchPageSize;
      const pageItems = searchResults.slice(start, end);

      const listDiv = document.getElementById("search-results-list");
      listDiv.innerHTML = "";

      if (pageItems.length === 0) {
        listDiv.innerHTML = `<div style="text-align: center; color: var(--muted-foreground); padding: 60px 0; grid-column: 1 / -1;">无符合搜索条件的结果</div>`;
      } else {
        pageItems.forEach(item => {
          const cover = item.cover || FALLBACK_COVER;
          const badgeLabel = item.source === 'jm' ? '禁漫天堂' : '哔咔漫画';
          const badgeClass = item.source;
          const authors = item.author || '佚名';
          const categories = item.category || '未分类';
          const metaText = `作者：${authors}  ·  分类：${categories}`;
          const description = item.description || '暂无描述信息。';

          const card = document.createElement("div");
          card.className = "search-result-card";
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");
          card.setAttribute("aria-label", item.title);
          card.onclick = () => openComic(item.source, item.id);
          card.onkeydown = (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openComic(item.source, item.id);
            }
          };
          card.innerHTML = `
            <img class="search-result-card-cover" src="${cover}" alt="${item.title}" loading="lazy" onerror="this.onerror=null; this.src='${FALLBACK_COVER}'">
            <div class="search-result-card-content">
              <div>
                <div class="search-result-card-title" title="${item.title}">${item.title}</div>
                <div class="search-result-card-desc" title="${description}">${description}</div>
              </div>
              <div class="search-result-card-meta" title="${metaText}">${metaText}</div>
            </div>
            <div class="search-result-card-badge ${badgeClass}">${badgeLabel}</div>
          `;
          listDiv.appendChild(card);
        });
      }

      const resultsSection = document.getElementById("search-results-section");
      if (resultsSection) {
        resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      renderSearchPagination();
    }

    function renderSearchPagination() {
      const container = document.getElementById("search-pagination");
      container.innerHTML = "";

      const totalPages = Math.ceil(searchResults.length / searchPageSize);
      if (totalPages <= 1) {
        return;
      }

      // Prev Button
      const prevBtn = document.createElement("button");
      prevBtn.className = "pagination-btn";
      prevBtn.innerText = "上一页";
      prevBtn.disabled = searchCurrentPage === 1;
      prevBtn.onclick = () => renderSearchPage(searchCurrentPage - 1);
      container.appendChild(prevBtn);

      // Numeric Buttons
      let startPage = Math.max(1, searchCurrentPage - 2);
      let endPage = Math.min(totalPages, searchCurrentPage + 2);

      if (startPage > 1) {
        const firstBtn = document.createElement("button");
        firstBtn.className = "pagination-btn";
        firstBtn.innerText = "1";
        firstBtn.onclick = () => renderSearchPage(1);
        container.appendChild(firstBtn);

        if (startPage > 2) {
          const dots = document.createElement("span");
          dots.innerText = "...";
          dots.style.color = "var(--muted-foreground)";
          dots.style.padding = "0 4px";
          container.appendChild(dots);
        }
      }

      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement("button");
        pageBtn.className = `pagination-btn${i === searchCurrentPage ? ' active' : ''}`;
        pageBtn.innerText = i;
        pageBtn.onclick = () => renderSearchPage(i);
        container.appendChild(pageBtn);
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          const dots = document.createElement("span");
          dots.innerText = "...";
          dots.style.color = "var(--muted-foreground)";
          dots.style.padding = "0 4px";
          container.appendChild(dots);
        }

        const lastBtn = document.createElement("button");
        lastBtn.className = "pagination-btn";
        lastBtn.innerText = totalPages;
        lastBtn.onclick = () => renderSearchPage(totalPages);
        container.appendChild(lastBtn);
      }

      // Next Button
      const nextBtn = document.createElement("button");
      nextBtn.className = "pagination-btn";
      nextBtn.innerText = "下一页";
      nextBtn.disabled = searchCurrentPage === totalPages;
      nextBtn.onclick = () => renderSearchPage(searchCurrentPage + 1);
      container.appendChild(nextBtn);
    }

    async function performSearch() {
      const keyword = document.getElementById("search-input").value.trim();
      if (!keyword) {
        showToast("请输入要检索的漫画名称或 ID（如 jm23143）");
        return;
      }

      const loader = document.getElementById("search-loader");
      const resultsSection = document.getElementById("search-results-section");

      document.body.classList.remove("home-search-mode");
      document.getElementById("main-container").classList.remove("centered-mode");
      
      loader.style.display = "block";
      resultsSection.style.display = "none";

      try {
        const res = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`);
        const result = await res.json();
        
        loader.style.display = "none";

        const jmItems = result.all_results?.jm || [];
        const bikaItems = result.all_results?.bika || [];
        let merged = [...jmItems, ...bikaItems];

        // Compute similarity and sort
        merged.forEach(item => {
          item.similarity = getSimilarity(keyword, item.title);
        });

        // Sort by similarity descending
        merged.sort((a, b) => b.similarity - a.similarity);

        searchResults = merged;
        searchCurrentPage = 1;

        document.getElementById("search-results-count").innerText = `为您找到 ${merged.length} 条符合条件的漫画`;
        resultsSection.style.display = "block";

        renderSearchPage(1);

      } catch (err) {
        loader.style.display = "none";
        showToast("聚合搜索发生错误，请检查网络或哔咔账号状态！");
        console.error(err);
      }
    }

          chListDiv.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--muted-foreground); padding: 40px 0;">未检索到可读章节，请检查该漫画是否因封禁下架。</div>`;

    function setReaderMode(mode) {
      readerMode = mode;
      
      const overlay = document.getElementById("reader-overlay");
      const btnScroll = document.getElementById("btn-reader-scroll");
      const btnPage = document.getElementById("btn-reader-page");
      
      if (mode === "scroll") {
        overlay.classList.remove("mode-page");
        overlay.classList.add("mode-scroll");
        btnScroll.classList.add("active");
        btnPage.classList.remove("active");
      } else {
        overlay.classList.remove("mode-scroll");
        overlay.classList.add("mode-page");
        btnScroll.classList.remove("active");
        btnPage.classList.add("active");
      }
      
      renderReaderContent();
    }

    // 阅读器图片失败时，用占位 DOM 替换 img（CSS 控制样式，跟随阅读器深色背景）
    function replaceWithReaderError(img, pageNum) {
      const ph = document.createElement("div");
      ph.className = "reader-error-page";
      ph.innerHTML = `
        <iconify-icon icon="lucide:image-off" style="font-size: 2rem;"></iconify-icon>
        <span>第 ${pageNum} 页加载失败</span>
      `;
      if (img.parentNode) img.parentNode.replaceChild(ph, img);
    }

    function renderReaderContent() {
      const container = document.getElementById("reading-container");
      container.innerHTML = "";

      const total = readerImages.length;
      document.getElementById("reader-page-indicator").innerText = `${total > 0 ? readerCurrentIndex + 1 : 0} / ${total}`;

      if (total === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--destructive); padding: 100px 0;">当前章节暂无图片，或该平台限制访问。</p>`;
        return;
      }

      if (readerMode === "scroll") {
        readerImages.forEach((imgUrl, idx) => {
          const img = document.createElement("img");
          img.src = imgUrl;
          img.alt = `第 ${idx + 1} 页`;
          img.loading = "lazy";
          img.onerror = () => replaceWithReaderError(img, idx + 1);
          container.appendChild(img);
        });
      } else {
        const img = document.createElement("img");
        img.src = readerImages[readerCurrentIndex];
        img.alt = `第 ${readerCurrentIndex + 1} 页`;
        img.onerror = () => replaceWithReaderError(img, readerCurrentIndex + 1);
        container.appendChild(img);
      }
    }

    function navigateReader(direction, event) {
      if (event) event.stopPropagation();
      
      const total = readerImages.length;
      if (total === 0) return;
      
      if (readerMode === "scroll") {
        const container = document.getElementById("reading-container");
        if (container) {
          const scrollAmount = window.innerHeight * 0.8 * direction;
          container.scrollBy({ top: scrollAmount, behavior: "smooth" });
        }
      } else {
        let newIdx = readerCurrentIndex + direction;
        if (newIdx < 0) {
          showToast("这已经是第一页了");
          return;
        }
        if (newIdx >= total) {
          showToast("这已经是最后一页了，本章已读完");
          return;
        }
        readerCurrentIndex = newIdx;
        renderReaderContent();
      }
    }

    function handleReaderClick(event) {
      const overlay = document.getElementById("reader-overlay");
      
      if (readerMode !== "page") {
        overlay.classList.toggle("show-controls");
        return;
      }
      
      const clickY = event.clientY;
      const height = window.innerHeight;
      const ratio = clickY / height;
      
      if (ratio < 0.35) {
        navigateReader(-1);
      } else if (ratio > 0.65) {
        navigateReader(1);
      } else {
        overlay.classList.toggle("show-controls");
      }
    }

      const password = document.getElementById("login-password").value;
      if (!email || !password) {
        showToast("授权邮箱和密码不能为空！");
        return;
      }
      
      const submitBtn = document.querySelector(".btn-submit");
      submitBtn.innerText = "正在登录...";
      submitBtn.disabled = true;
      
      try {
        const res = await fetch("/api/bika/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ account: email, password })
        });
        const result = await res.json();
        
        submitBtn.innerText = "授权绑定";
        submitBtn.disabled = false;
        
        if (result.success) {
          showToast("哔咔账号登录成功，Token 已保存。");
          document.getElementById("bika-dot").className = "dot green";
          document.getElementById("bika-status-text").innerText = "哔咔已登录";
          hideLoginModal();
          
          // 如果当前处于哔咔有关的选项卡，建议刷新一次
          const activeTrigger = document.querySelector(".tab-trigger.active");
          if (activeTrigger) {
            const tabId = activeTrigger.id.replace("trigger-", "");
            if (tabId !== "search") {
              switchTab(tabId);
            }
          }
        } else {
          showToast(`授权失败: ${result.error || "未知原因，请检查账号密码"}`);
        }
      } catch (err) {
        submitBtn.innerText = "授权绑定";
        submitBtn.disabled = false;
        showToast("连接服务器发生通讯故障，请重试！");
      }
    }

    // Keyboard listener for reader
    window.addEventListener("keydown", (e) => {
      const reader = document.getElementById("reader-overlay");
      if (reader && reader.style.display === "flex") {
        if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
          e.preventDefault();
          navigateReader(-1);
        } else if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          navigateReader(1);
        } else if (e.key === "Escape") {
          e.preventDefault();
          closeReader();
        }
      }
    });
  </script>
</body>
</html>
